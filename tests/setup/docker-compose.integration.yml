services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gitlabhq_production
      POSTGRES_USER: gitlab
      POSTGRES_PASSWORD: gitlab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitlab -d gitlabhq_production"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"

  minio:
    image: minio/minio:RELEASE.2026-01-18T00-31-37Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "9000:9000"
      - "9001:9001"

  minio-provision:
    image: minio/mc:RELEASE.2026-02-20T00-33-16Z
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/floci-e2e-gitlab-artifacts &&
      mc mb --ignore-existing local/floci-e2e-gitlab-uploads &&
      mc mb --ignore-existing local/floci-e2e-gitlab-packages &&
      mc mb --ignore-existing local/floci-e2e-gitlab-lfs &&
      mc mb --ignore-existing local/floci-e2e-gitlab-terraform-state &&
      mc mb --ignore-existing local/floci-e2e-gitlab-dependency-proxy &&
      mc mb --ignore-existing local/floci-e2e-gitlab-secure-files &&
      mc mb --ignore-existing local/floci-e2e-gitlab-external-diffs &&
      mc mb --ignore-existing local/floci-e2e-gitlab-backups &&
      mc mb --ignore-existing local/floci-e2e-gitlab-tmp
      "
